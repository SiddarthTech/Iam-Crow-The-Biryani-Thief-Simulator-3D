<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I am Crow: The Biryani Thief</title>
    <style>
        body { 
            background: linear-gradient(135deg, #1e1e2f, #111119); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            padding: 40px 20px;
            margin: 0;
        }
        h1 { 
            color: #ffcc00; 
            font-size: 2.5rem;
            text-shadow: 2px 2px 10px rgba(255, 204, 0, 0.3);
            margin-bottom: 5px;
        }
        h3 {
            color: #a0a0ca;
            font-weight: 400;
            margin-top: 0;
        }
        .logo-container {
            margin: 30px auto;
            max-width: 320px;
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px dashed #444;
            border-radius: 15px;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 10px;
        }
        .logo { 
            max-width: 100%; 
            max-height: 300px;
            border-radius: 10px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
        }
        .status-box { 
            background-color: #1a1a26; 
            padding: 20px; 
            display: inline-block; 
            border-radius: 10px; 
            border: 1px solid #ffcc00;
            box-shadow: 0 4px 15px rgba(255, 204, 0, 0.1);
            max-width: 500px;
            text-align: left;
        }
        .bullet { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🦅 I am Crow: The Biryani Thief 🍗</h1>
    <h3>Welcome to Sanvordem, Goa!</h3>
    
    <div class="logo-container">
        <img src="logo.png" alt="Crow Logo Upload Hote Hi Yahan Dikhega! 🦅" class="logo" onerror="this.style.display='none';">
    </div>

    <div class="status-box">
        <p style="text-align: center; margin-top: 0; font-size: 1.2rem;"><strong>🚀 Game Progress Status</strong></p>
        <hr style="border-color: #333;">
        <p><span class="bullet">✔</span> Source Code (.cpp) Repository Active</p>
        <p><span class="bullet">✔</span> Map Location: Sanvordem City Layout Set</p>
        <p><span class="bullet">⏳ Next Update:</span> WebAssembly Engine Integration (WASD & Joystick Controls)</p>
    </div>

</body>
</html>
